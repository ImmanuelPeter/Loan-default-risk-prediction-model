<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="auto">
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- Grid lines -->
  <line x1="30" y1="40" x2="470" y2="40" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="30" y1="100" x2="470" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="30" y1="160" x2="470" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="30" y1="220" x2="470" y2="220" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Smooth Area Curve -->
  <path d="M40 210 Q 120 190, 180 130 T 320 110 T 460 50 L 460 230 L 40 230 Z" fill="url(#areaGrad)"/>
  <!-- Smooth Line -->
  <path d="M40 210 Q 120 190, 180 130 T 320 110 T 460 50" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Data nodes -->
  <circle cx="180" cy="130" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="320" cy="110" r="5" fill="#818CF8" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="460" cy="50" r="6" fill="#34D399" stroke="#FFFFFF" stroke-width="2"/>
</svg>
